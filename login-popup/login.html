<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login Popup</title>

    <link rel="stylesheet" href="../styles/scrollbar.css">
    <link rel="stylesheet" href="css/login-popup.css">

    <link rel="stylesheet" href="../lib/fontawesome/css/font-awesome.css">
    <script async src="https://cse.google.com/cse.js?cx=a03357156e839496f"></script>

</head>

<body>

    <button class="open-btn" id="openBtn" style="position:static">Open Login Popup</button>


    <!-- overlay + modal -->
    <div class="overlay" id="overlay" aria-hidden>
        <div class="login-modal" role="dialog" aria-modal="true">
            <div class="login-modal-left">
                <div class="brand-box">
                    <img src="../images/user.png" alt="logo" />
                </div>
            </div>
            <div class="login-modal-right">
                <button class="language-switcher" title="Change Language">
                    <i class="fa fa-globe"></i>
                </button>
                <div class="title">Login To Your Account</div>
                <div class="subtitle">Select one of the multiple Login options below, which you already signed up with Earlier.</div>
                
                <div class="login-type-dropdown">
                    <button class="login-type-toggle" id="loginTypeToggle">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span class="login-type-selected">Select Login Type</span>
                        <i class="fa fa-chevron-down"></i>
                    </button>
                    <div class="login-type-menu" id="loginTypeMenu">
                        <ul>
                            <li><a href="#" data-value="email-password">Email & Password</a></li>
                            <li><a href="#" data-value="email-otp">Email & OTP</a></li>
                            <li><a href="#" data-value="mobile-otp">Mobile/Whatsapp & OTP</a></li>
                        </ul>
                    </div>
                </div>

                <div class="field">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 12a4 4 0 100-8 4 4 0 000 8z" stroke="#6b7280" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M20 21v-1a4 4 0 00-4-4H8a4 4 0 00-4 4v1" stroke="#6b7280" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <input type="text" placeholder="Username or Email" />
                </div>


                <div class="field">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="11" width="18" height="11" rx="2" stroke="#6b7280" stroke-width="1.5" />
                        <path d="M7 11V8a5 5 0 0110 0v3" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <input type="password" placeholder="Password" />
                    <button title="toggle"
                        style="border:0;background:transparent;cursor:pointer;padding:0;margin-left:6px;font-size:14px">👁️</button>
                </div>

                <div class="checkbox-row">
                    <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" /> Remember Me</label>
                   
                    
                <div class="forgot-password-dropdown">
                    <button class="forgot-password-toggle" id="forgotPasswordToggle">
                        Forgot Password?
                        <i class="fa fa-chevron-down"></i>
                    </button>
                    <div class="forgot-password-menu" id="forgotPasswordMenu">
                        <div class="forgot-password-text">Reset password using:</div>
                        <ul>
                            <li><a href="#">Email</a></li>
                            <li><a href="#">Whatsapp</a></li>
                        </ul>
                    </div>
                </div>
                </div>

                <button class="login-btn">Log in</button>

                <div class="divider"><span class="line"></span><span>or Login with</span><span class="line"></span>
                </div>

                <div class="social">
                    <div class="s">
                        <img src="../images/google-logo.png" alt="google" class="google-logo"/>
                    </div>
                    <div class="s">
                        <img src="../images/odoo-logo.jpeg" alt="Odoo" />
                    </div>
                    <div class="s">
                        <img src="../images/facebook-icon.png" alt="Facebook" />
                    </div>
                </div>

                <div class="signup-link">
                    <span class="signup-text">Don't have an account!</span>
                    <a href="#" class="signup-link-text">Sign Up Here</a>
                </div>

            </div>
        </div>
    </div>

    <script>
        const openBtn = document.getElementById('openBtn');
        const overlay = document.getElementById('overlay');
        openBtn.addEventListener('click', () => {
            overlay.classList.add('show');
            overlay.setAttribute('aria-hidden', 'false');
        })
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) overlay.classList.remove('show');
        })
        // allow escape key to close
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') overlay.classList.remove('show') })
    </script>

    <script src="script/dropdown.js"></script>
    <script src="script/login-popup.js"></script>

</body>

</html>
