<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <title>WELCOME POPUP</title>

  <script async src="https://cse.google.com/cse.js?cx=a03357156e839496f"></script>
  <link rel="stylesheet" href="../lib/fontawesome/css/font-awesome.css">
  <link rel="stylesheet" href="../styles/scrollbar.css">
  <link rel="stylesheet" href="css/welcome-popup.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

</head>
<body>

    <button onclick="openPopup(); triggerConfetti();">Open Popup</button>

    <div class="welcome-popup">
        <div class="welcome-popup-content">
            <button class="close-btn" onclick="closePopup()">&times;</button>
            <h1>Company setup wizard</h1>
            <div class="welcome-popup-contents">
                <div class="welcome-popup-content-image">
                <img src="../images/WELCOME.png" alt="Company setup wizard WELCOME IMAGE">
                </div>
                <div class="welcome-popup-content-text">
                    <p>Thanks for your choosing BMH marketplace to power
                        your online business</p>
                    <p>-- Let's start by <strong>creating your company profile</strong> --</p>
                </div>
            </div>

            <div class="welcome-popup-buttons">
                <button class="remind-later-btn" onclick="closePopup()">
                    <i class="fa fa-clock-o"></i> Remind me later
                </button>
                <button class="let-go-btn" onclick="closePopup()">
                    Let's go <i class="fa fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>
  
    <script src="scripts/welcome-popup.js"></script>
</body>
</html>
