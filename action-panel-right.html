<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <link rel="stylesheet" href="styles/action-panel-right.css">
  <script src="https://kit.fontawesome.com/be478a590c.js" crossorigin="anonymous"></script>

</head>

<body>

  
  <!-- Action Panel -->
  <div class="action-panel" id="actionPanel">
    <div class="panel-header">
      <h3>Quick Actions</h3>
      <button class="panel-close" onclick="closePanel()">×</button>
    </div>
  </div>

  <!-- Panel Toggle Button -->
  <button class="panel-toggle" onclick="togglePanel()">
    <i class="fa fa-bars"></i>
  </button>
 
  <script src="script/action-panel-right.js"> </script>
</body>

</html>
