<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BMH Building Materials Hub</title>

    <link rel="stylesheet" href="css/home-bmh.css">
    <link rel="stylesheet" href="../styles/scrollbar.css">
    <link rel="stylesheet" href="../lib/fontawesome/css/font-awesome.css">
    <link rel="stylesheet" href="css/search-details.css">

</head>

<body>

    <header>
        <h1>BMH Header - Home Page</h1>
    </header>

        <div class="bmh-home-page-container">
            <img src="images/bmh-home.png" alt="BMH Logo" class="bmh-home-page-logo">
    
            <div class="bmh-home-page-search-wrapper">
                <div class="bmh-home-page-search-box">
                    <span class="bmh-home-page-icon left"><i class="fa fa-search"></i></span>
                    <input type="text" id="search-input" placeholder="Search Google or type a URL">
                    <span class="bmh-home-page-icon right"><i class="fa fa-microphone"></i></span>
                    <span class="bmh-home-page-icon right"><i class="fa fa-camera"></i></span>
                </div>
                
                <!-- Search Results Dropdown -->
                <div class="bmh-home-page-results-dropdown" id="results-dropdown">
                    <div class="bmh-home-page-results-cards">
                        <!-- Card 1 -->
                        <div class="bmh-home-page-result-card">
                            <div class="bmh-home-page-result-card-icon" style="border: 1px solid #3b82f6;">
                                <img src="../images/bmh-logo.png" alt="BMH Construction Group" style="width: 100%; height: 100%; object-fit: contain; padding: 8px;">
                            </div>
                            <div class="bmh-home-page-result-card-content">
                                <h3 class="bmh-home-page-result-card-title">BMH Construction Group</h3>
                                <p class="bmh-home-page-result-card-sub-title">Products: 100</p>
                            </div>
                            <button class="bmh-home-page-result-card-favorite">
                                <i class="fa fa-star-o"></i>
                            </button>
                        </div>

                        <!-- Card 2 -->
                        <div class="bmh-home-page-result-card">
                            <div class="bmh-home-page-result-card-icon" style="border: 1px solid #3b82f6;">
                                <img src="images/profile-settings.png" alt="Al Tijara Contracting Co." style="width: 100%; height: 100%; object-fit: contain; padding: 8px;">
                            </div>
                            <div class="bmh-home-page-result-card-content">
                                <h3 class="bmh-home-page-result-card-title">Al Tijara Contracting Co.</h3>
                                <p class="bmh-home-page-result-card-sub-title">info@altijaracontracting.com</p>
                            </div>
                            <button class="bmh-home-page-result-card-favorite">
                                <i class="fa fa-star-o"></i>
                            </button>
                        </div>

                        <!-- Card 3 -->
                        <div class="bmh-home-page-result-card">
                            <div class="bmh-home-page-result-card-icon" style="border: 1px solid #3b82f6;">
                                <img src="../images/our-products-icon.png" alt="Premium Concrete Mix" style="width: 100%; height: 100%; object-fit: contain; padding: 8px;">
                            </div>
                            <div class="bmh-home-page-result-card-content">
                                <h3 class="bmh-home-page-result-card-title">Premium Concrete Mix</h3>
                                <p class="bmh-home-page-result-card-sub-title">Category: Building Materials</p>
                            </div>
                            <button class="bmh-home-page-result-card-favorite">
                                <i class="fa fa-star-o"></i>
                            </button>
                        </div>

                    </div>
                    
                    <!-- Detailed Search Button -->
                    <div class="bmh-home-page-detailed-search-container">
                        <a href="search-details.html" class="bmh-home-page-detailed-search-btn">Detailed Search</a>
                    </div>
                </div>
            </div>
    
            <div class="bmh-home-page-shortcut" title="Add shortcut">
                <div class="bmh-home-page-circle">
                    +
                </div>
                <p class="bmh-home-page-shortcut-text">Add shortcut</p>
            </div>
        </div>
    
    
    <script>
        const searchInput = document.getElementById('search-input');
        const resultsDropdown = document.getElementById('results-dropdown');
        
        // Show dropdown when user starts typing
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query.length > 0) {
                resultsDropdown.style.display = 'block';
            } else {
                resultsDropdown.style.display = 'none';
            }
        });
        
        // Hide dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.bmh-home-page-search-wrapper')) {
                resultsDropdown.style.display = 'none';
            }
        });
        
        // Show dropdown on focus if there's text
        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim().length > 0) {
                resultsDropdown.style.display = 'block';
            }
        });
    </script>

</body>
</html>
