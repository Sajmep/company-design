<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>360 Project View</title>

  <link rel="stylesheet" href="../styles/scrollbar.css">
  <link rel="stylesheet" href="css/preview-360.css">
  <link rel="stylesheet" href="../lib/fontawesome/css/font-awesome.css">
  
  <!-- Three.js and Panolens for 360 Viewer -->
</head>

<body>
  <!-- Panorama Preview Container -->
  <div class="panorama-preview-container">
    <!-- Panorama Viewer Container (will be created by JavaScript) -->
    <div id="panoramaImage"></div>
    
    <!-- Debug Info Panel (for troubleshooting) -->
    <div id="debugPanel" style="position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: white; padding: 10px; border-radius: 5px; font-size: 12px; z-index: 10000; display: none; max-width: 300px;">
      <strong>VR Debug Info:</strong><br>
      <div id="debugContent"></div>
    </div>
    
    <!-- Back Button (Left Side) -->
    <button class="panorama-back-btn" id="backBtn">
      <i class="fa fa-arrow-left"></i>
    </button>
    
    <!-- Sidebar Toggle Button (Right Side) -->
    <button class="panorama-sidebar-toggle" id="sidebarToggleBtn">
      <i class="fa fa-bars"></i>
    </button>
    
    <!-- VR Control Button (Combined VR Enter/Exit and Reticle Toggle) -->
    <button class="vr-control-btn" id="vrControlBtn" title="Enter VR Mode">
      <i class="fa fa-cube"></i>
    </button>
    
    <!-- Direction Map/Compass Indicator -->
    <div class="direction-map">
      <div class="compass-container">
        <div class="compass-north-label">N</div>
        <div class="compass-arrow">
          <div class="arrow-shape"></div>
        </div>
        <div class="compass-hotspots" id="compassHotspots"></div>
      </div>
    </div>
    
    <!-- Sidebar -->
    <div class="panorama-sidebar" id="panoramaSidebar">
      <div class="panorama-sidebar-header">
        <h3>Panoramas</h3>
        <button class="panorama-sidebar-close" id="sidebarCloseBtn">
          <i class="fa fa-times"></i>
        </button>
      </div>
      
      <div class="panorama-sidebar-content">
        <!-- Panorama Preview Items -->
        <div class="panorama-item active">
          <div class="panorama-item-image">
            <img src="images/360-1.jpg" alt="Living Room Panorama">
            <div class="panorama-item-badge">Current</div>
          </div>
          <div class="panorama-item-info">
            <h4>Living Room</h4>
          </div>
        </div>
        
        <div class="panorama-item">
          <div class="panorama-item-image">
            <img src="images/360-2.jpg" alt="Terrace Panorama">
          </div>
          <div class="panorama-item-info">
            <h4>Terrace</h4>
          </div>
        </div>
        
        <div class="panorama-item">
          <div class="panorama-item-image">
            <img src="images/360-3.jpg" alt="Kitchen Panorama">
          </div>
          <div class="panorama-item-info">
            <h4>Kitchen</h4>
          </div>
        </div>
         
        <div class="panorama-item">
          <div class="panorama-item-image">
            <img src="images/360.jpg" alt="Bedroom Panorama">
          </div>
          <div class="panorama-item-info">
            <h4>Bedroom</h4>
          </div>
        </div>
      </div>
      
      <div class="panorama-sidebar-footer">
        <button class="panorama-add-btn" id="addPanoramaBtn">
          <i class="fa fa-plus"></i>
          <span>Add More</span>
        </button>
      </div>
    </div>
    
    <!-- Sidebar Overlay -->
    <div class="panorama-sidebar-overlay" id="sidebarOverlay"></div>
  </div>

  <!-- Hotspot Info Popup -->
  <div id="hotspotInfoPopup" class="hotspot-info-popup" style="display: none;"></div>

  <!-- Three.js and Panolens -->
<!-- Use Three.js r117 - works with Panolens and has WebXR -->
<script src="https://cdn.jsdelivr.net/npm/three@0.110.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/panolens@0.12.0/build/panolens.min.js"></script>
  <script src="scripts/preview-360.js"></script>
</body>

</html>
