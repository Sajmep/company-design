<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Inquiry</title>

    <link rel="stylesheet" href="../styles/scrollbar.css">
    <link rel="stylesheet" href="../lib/fontawesome/css/font-awesome.css">
    <link rel="stylesheet" href="css/create-inquiry.css">
    <script async src="https://cse.google.com/cse.js?cx=a03357156e839496f"></script>

</head>

<body>
  <div class="create-inquiry-container">
    <div class="create-inquiry-header">
      <h1>Create Inquiry</h1>
    </div>
    
    <form class="create-inquiry-form" id="createInquiryForm">
      <div class="form-row">
        <div class="form-column">
          <div class="form-group">
            <label for="title">Title <span class="required">*</span></label>
            <input type="text" id="title" name="title" required placeholder="Enter inquiry title">
          </div>
          
          <div class="form-group">
            <label for="description">Description <span class="required">*</span></label>
            <textarea id="description" name="description" rows="5" required placeholder="Enter inquiry description"></textarea>
          </div>
          
          <div class="form-group">
            <label for="budget">Budget</label>
            <input type="number" id="budget" name="budget" placeholder="Enter budget amount">
          </div>
          
          <div class="form-group">
            <label for="service">Service <span class="required">*</span></label>
            <input type="text" id="service" name="service" required placeholder="Enter service type">
          </div>
        </div>
        
        <div class="form-column">
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Enter city">
          </div>
          
          <div class="form-group">
            <label for="state">State</label>
            <input type="text" id="state" name="state" placeholder="Enter state">
          </div>
          
          <div class="form-group">
            <label for="country">Country</label>
            <input type="text" id="country" name="country" placeholder="Enter country">
          </div>
          
          <div class="form-group">
            <label for="zip">Zip Code</label>
            <input type="text" id="zip" name="zip" placeholder="Enter zip code">
          </div>
        </div>
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-submit">Create Inquiry</button>
        <button type="button" class="btn btn-cancel">Cancel</button>
      </div>
    </form>
  </div>

</body>

</html>
