<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Announcement Popup</title>

    <link rel="stylesheet" href="../styles/scrollbar.css">
    <link rel="stylesheet" href="../lib/fontawesome/css/font-awesome.css">
    <link rel="stylesheet" href="css/announcement-popup.css">

</head>

<body>

    <header>
        <h1>BMH Header - Announcement Popup</h1>
        <button class="announcement-popup-open-button" onclick="openAnnouncementPopup()">
            <i class="fa fa-bullhorn"></i> New Announcement
        </button>

    </header>

    <div class="announcement-popup" style="display: none;">
        <div class="announcement-popup-content">
            <div class="announcement-popup-header">
                <div class="announcement-popup-header-left">
                    <h3>New Announcement</h3>
                    <button class="announcement-popup-close" onclick="closeAnnouncementPopup()">&times;</button>
                </div>
                <div class="announcement-popup-header-right">
                    <!-- Staging Section -->
                    <div class="announcement-popup-staging-section">
                        <div class="announcement-popup-staging-arrow">
                            <div class="announcement-popup-stage announcement-popup-stage-active">
                                <div class="announcement-popup-stage-content">
                                    <div class="announcement-popup-stage-label">Draft</div>
                                </div>
                            </div>
                            <div class="announcement-popup-arrow-connector"></div>
                            <div class="announcement-popup-stage">
                                <div class="announcement-popup-stage-content">
                                    <div class="announcement-popup-stage-label">Submit</div>
                                </div>
                            </div>
                            <div class="announcement-popup-arrow-connector"></div>
                            <div class="announcement-popup-stage">
                                <div class="announcement-popup-stage-content">
                                    <div class="announcement-popup-stage-label">Approve</div>
                                </div>
                            </div>
                            <div class="announcement-popup-arrow-connector"></div>
                            <div class="announcement-popup-stage">
                                <div class="announcement-popup-stage-content">
                                    <div class="announcement-popup-stage-label">Done</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="announcement-popup-send-dropdown">
                        <div class="announcement-popup-dropdown-toggle" onclick="toggleDropdown()">
                            <div class="announcement-popup-dropdown-selected">
                                <img src="../images/user.png" alt="All Contacts" class="announcement-popup-user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=All+Contacts&background=012f6d&color=fff&size=32'">
                                <span class="announcement-popup-user-name">Select Contacts</span>
                            </div>
                            <i class="fa fa-chevron-down"></i>
                        </div>
                        <div class="announcement-popup-dropdown-menu" id="sendDropdown">
                          
                            <div class="announcement-popup-dropdown-item" data-value="john-doe">
                                <img src="../images/mike.png" alt="Fazli" class="announcement-popup-user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=John+Doe&background=012f6d&color=fff&size=32'">
                                <span class="announcement-popup-user-name">Fazli</span>
                            </div>
                            <div class="announcement-popup-dropdown-item" data-value="jane-smith">
                                <img src="../images/sofia.png" alt="Ahmad Al-Qahtani" class="announcement-popup-user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Jane+Smith&background=012f6d&color=fff&size=32'">
                                <span class="announcement-popup-user-name">Ahmad Al-Qahtani</span>
                            </div>
                            <div class="announcement-popup-dropdown-item" data-value="mike-johnson">
                                <img src="../images/sofia.png" alt="Josabele Cruz" class="announcement-popup-user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Josabele+Cruz&background=012f6d&color=fff&size=32'">
                                <span class="announcement-popup-user-name">Josabele Cruz</span>
                            </div>
                            <div class="announcement-popup-dropdown-item" data-value="sarah-williams">
                                <img src="../images/sarah.png" alt="Sarah Williams" class="announcement-popup-user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Sarah+Williams&background=012f6d&color=fff&size=32'">
                                <span class="announcement-popup-user-name">Sarah Williams</span>
                            </div>
                            <div class="announcement-popup-dropdown-item" data-value="david-brown">
                                <img src="../images/user.png" alt="David Brown" class="announcement-popup-user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=David+Brown&background=012f6d&color=fff&size=32'">
                                <span class="announcement-popup-user-name">David Brown</span>
                            </div>
                            <div class="announcement-popup-dropdown-item" data-value="emily-davis">
                                <img src="../images/zoia.jpg" alt="Emily Davis" class="announcement-popup-user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Emily+Davis&background=012f6d&color=fff&size=32'">
                                <span class="announcement-popup-user-name">Emily Davis</span>
                            </div>
                            <div class="announcement-popup-dropdown-actions">
                                <button type="button" class="announcement-popup-dropdown-action-btn" onclick="searchContacts()">
                                    <i class="fa fa-search"></i>
                                    <span>Search</span>
                                </button>
                                <button type="button" class="announcement-popup-dropdown-action-btn" onclick="inviteContact()">
                                    <i class="fa fa-user-plus"></i>
                                    <span>Invite</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="announcement-popup-body">
                <form id="announcementForm">
                    <div class="announcement-popup-form-group">
                        <label for="announcementTitle">Title</label>
                        <input type="text" id="announcementTitle" name="title" placeholder="Enter announcement title"
                            required>
                    </div>
                    
                    <div class="announcement-popup-form-group">
                        <label for="announcementContent">Content</label>
                        <textarea id="announcementContent" name="content" rows="6"
                            placeholder="Enter announcement content" required></textarea>
                    </div>

                    <div class="announcement-popup-seetings">

                        <div class="announcement-popup-form-group">
                            <label for="announcementType">Announcement Type</label>
                            <select id="announcementType" name="type" required>
                                <option value="">Select announcement type</option>
                                <option value="general">General</option>
                                <option value="system-update">System Update</option>
                                <option value="new-feature">New Feature</option>
                                <option value="maintenance">Maintenance</option>
                                <option value="promotion">Promotion</option>
                                <option value="alert-urgent">Alert / Urgent</option>
                            </select>
                        </div>

                        <div class="announcement-popup-form-group">
                            <label for="announcementVisibility">Visibility</label>
                            <select id="announcementVisibility" name="visibility" required>
                                <option value="">Select visibility</option>
                                <option value="public">Public</option>
                                <option value="private">Private</option>
                                <option value="internal-only">Internal Only</option>
                            </select>
                        </div>

                        <div class="announcement-popup-form-group">
                            <label class="announcement-popup-checkbox-label">
                                <input type="checkbox" id="announcementPinned" name="pinned" value="yes">
                                <span>Pinned (pin to top)</span>
                            </label>
                        </div>

                        <div class="announcement-popup-form-group">
                            <label for="announcementRelatedEntity">Related Entity Type</label>
                            <select id="announcementRelatedEntity" name="relatedEntity">
                                <option value="">Select related entity type</option>
                                <option value="project">Project</option>
                                <option value="tender">Tender</option>
                                <option value="product">Product</option>
                                <option value="company">Company</option>
                                <option value="event">Event</option>
                                <option value="document">Document</option>
                            </select>
                        </div>

                        <div class="announcement-popup-form-group">
                            <label for="announcementExpiryDate">Expiry Date</label>
                            <input type="date" id="announcementExpiryDate" name="expiryDate">
                        </div>

                        <div class="announcement-popup-form-group">
                            <label for="announcementAttachments">Attachments</label>
                            <input type="file" id="announcementAttachments" name="attachments" multiple>
                        </div>
                    </div>
                </form>
            </div>
            <div class="announcement-popup-footer">
                <button type="button" class="announcement-popup-cancel-button" onclick="closeAnnouncementPopup()">Cancel</button>
                <button type="button" class="announcement-popup-save-button" onclick="closeAnnouncementPopup()">Save</button>
            </div>
        </div>
    </div>

    <script src="scripts/announcement-popup.js"></script>
</body>

</html>
