<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tender Details</title>

  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/scrollbar.css">
  <link rel="stylesheet" href="css/tender-details.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Sticky Header (Always Visible) -->
 
  <!-- Top Summary Section (Decision Snapshot) -->


  <script>
    document.addEventListener('click', function (e) {
      var tab = e.target.closest('.tender-tab');
      if (!tab) return;
      var key = tab.getAttribute('data-tab');
      document.querySelectorAll('.tender-tab').forEach(function (t) {
        var active = t === tab;
        t.classList.toggle('is-active', active);
        t.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      document.querySelectorAll('.tender-tab-panel').forEach(function (p) {
        p.classList.toggle('is-active', p.getAttribute('data-panel') === key);
      });
    });
  </script>

</body>

</html>
